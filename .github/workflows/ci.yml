name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Go Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Go dependencies
        run: go mod download

      - name: Verify Go format
        run: test -z $(gofmt -l .)

      - name: Run Go unit tests
        run: go test -v ./...

      - name: Build Go binaries
        run: |
          go build -v -o bin/api ./cmd/api
          go build -v -o bin/worker ./cmd/worker
          go build -v -o bin/notifier ./cmd/notifier
          go build -v -o bin/migrate ./cmd/migrate

  dashboard-build:
    name: Dashboard Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install Dashboard dependencies
        run: |
          if [ -d "dashboard" ]; then
            cd dashboard && npm ci && npm run build
          fi
